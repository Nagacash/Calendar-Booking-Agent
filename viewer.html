<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendar Face</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #070707;
      --panel: #101010;
      --gold: #c4a35a;
      --gold-soft: #e2c987;
      --gold-dim: rgba(196, 163, 90, 0.22);
      --fog: rgba(255, 248, 230, 0.72);
      --line: rgba(196, 163, 90, 0.35);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--fog);
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(ellipse 70% 55% at 50% 18%, rgba(196, 163, 90, 0.14), transparent 58%),
        radial-gradient(ellipse 90% 70% at 50% 100%, rgba(40, 28, 10, 0.55), transparent 55%),
        linear-gradient(180deg, #0c0c0c 0%, var(--ink) 45%, #050505 100%);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.07;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(circle at center, black 20%, transparent 75%);
    }

    .shell {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(18px, 3vw, 36px);
      gap: clamp(14px, 2vw, 22px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      animation: rise 0.8s ease both;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-mark img {
      width: clamp(64px, 9vw, 92px);
      height: clamp(64px, 9vw, 92px);
      object-fit: cover;
      object-position: center;
      border-radius: 50%;
      background: #000;
      box-shadow:
        0 0 0 1px var(--gold-dim),
        0 12px 40px rgba(0, 0, 0, 0.55),
        0 0 48px rgba(196, 163, 90, 0.12);
      animation: seal 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .brand-copy h1 {
      margin: 0;
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(2.4rem, 6vw, 4.4rem);
      letter-spacing: 0.04em;
      line-height: 0.92;
      color: var(--gold-soft);
      text-shadow: 0 2px 24px rgba(196, 163, 90, 0.18);
    }

    .brand-copy p {
      margin: 6px 0 0;
      font-size: 0.95rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(226, 201, 135, 0.55);
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      background: rgba(16, 16, 16, 0.72);
      color: var(--gold-soft);
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .live-pill.on { opacity: 1; }

    .live-pill i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d24a3a;
      box-shadow: 0 0 12px rgba(210, 74, 58, 0.8);
      animation: pulse 1.4s ease-in-out infinite;
    }

    .stage-wrap {
      position: relative;
      min-height: 0;
      display: grid;
      place-items: center;
      animation: rise 1s ease 0.1s both;
    }

    .stage {
      position: relative;
      width: min(100%, 1100px);
      aspect-ratio: 16 / 9;
      background:
        linear-gradient(180deg, rgba(20, 16, 10, 0.4), rgba(0, 0, 0, 0.2)),
        var(--panel);
      border: 1px solid var(--line);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.65),
        inset 0 0 0 1px rgba(255, 255, 255, 0.02);
      overflow: hidden;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, transparent 70%, rgba(0, 0, 0, 0.45));
      z-index: 2;
    }

    .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      z-index: 3;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.7;
    }
    .corner.tl { top: 12px; left: 12px; border-width: 1px 0 0 1px; }
    .corner.tr { top: 12px; right: 12px; border-width: 1px 1px 0 0; }
    .corner.bl { bottom: 12px; left: 12px; border-width: 0 0 1px 1px; }
    .corner.br { bottom: 12px; right: 12px; border-width: 0 1px 1px 0; }

    #placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 32px;
      color: rgba(226, 201, 135, 0.45);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.85rem;
      z-index: 1;
    }

    #avatarVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      background: #000;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      animation: rise 1s ease 0.18s both;
    }

    button {
      appearance: none;
      border: 1px solid var(--gold);
      background: linear-gradient(180deg, #d2b36a 0%, #a8843a 100%);
      color: #14100a;
      font-family: "Bebas Neue", sans-serif;
      font-size: 1.35rem;
      letter-spacing: 0.14em;
      padding: 14px 28px;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 30px rgba(196, 163, 90, 0.18);
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      text-align: right;
    }

    #status {
      min-height: 1.2em;
      color: rgba(226, 201, 135, 0.55);
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    .powered {
      color: rgba(226, 201, 135, 0.42);
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    .powered span {
      color: var(--gold-soft);
      font-family: "Bebas Neue", sans-serif;
      font-size: 1.05rem;
      letter-spacing: 0.08em;
    }

    .powered:hover {
      color: rgba(226, 201, 135, 0.7);
    }

    @media (max-width: 720px) {
      .meta { align-items: flex-start; text-align: left; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes seal {
      from { opacity: 0; transform: scale(0.86) rotate(-6deg); }
      to { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    @media (max-width: 720px) {
      .brand { flex-direction: column; align-items: flex-start; }
      .stage { aspect-ratio: 4 / 5; }
      .brand-copy h1 { font-size: 2.6rem; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="brand">
      <div class="brand-mark">
        <img src="/logo.png" alt="Cobra logo" />
        <div class="brand-copy">
          <h1>Calendar Face</h1>
          <p>Accountability, live</p>
        </div>
      </div>
      <div class="live-pill" id="livePill"><i></i> Live session</div>
    </header>

    <section class="stage-wrap">
      <div class="stage" id="stage">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>
        <div id="placeholder">Strike connect — your calendar gets a face</div>
        <video id="avatarVideo" autoplay playsinline></video>
        <audio id="avatarAudio" autoplay></audio>
      </div>
    </section>

    <footer class="controls">
      <button id="connectBtn">Connect</button>
      <div class="meta">
        <div id="status">Ready for one session</div>
        <a class="powered" href="https://www.nagacodex.cloud/" target="_blank" rel="noopener noreferrer">
          Powered by <span>Naga Codex</span>
        </a>
      </div>
    </footer>
  </div>

  <script type="module">
    import { Room, RoomEvent, Track } from "https://cdn.jsdelivr.net/npm/livekit-client@2.15.4/+esm";

    const statusEl = document.getElementById("status");
    const btn = document.getElementById("connectBtn");
    const videoEl = document.getElementById("avatarVideo");
    const audioEl = document.getElementById("avatarAudio");
    const placeholder = document.getElementById("placeholder");
    const livePill = document.getElementById("livePill");
    let room;
    let hasVideo = false;
    let hasAudio = false;

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function updateStatus(identity) {
      const parts = [];
      if (hasVideo) parts.push("video");
      if (hasAudio) parts.push("audio");
      setStatus(`${parts.join(" + ") || "waiting"} · ${identity}`);
    }

    function attachTrack(track, participant) {
      if (track.kind === Track.Kind.Video) {
        track.attach(videoEl);
        videoEl.muted = false;
        videoEl.volume = 1;
        videoEl.style.display = "block";
        placeholder.style.display = "none";
        livePill.classList.add("on");
        videoEl.play().catch(() => {});
        hasVideo = true;
      } else if (track.kind === Track.Kind.Audio) {
        track.attach(audioEl);
        audioEl.muted = false;
        audioEl.volume = 1;
        audioEl.play().catch(() => {});
        hasAudio = true;
      }
      updateStatus(participant?.identity || "avatar");
    }

    function maybeAttachParticipant(participant) {
      for (const pub of participant.trackPublications.values()) {
        if (pub.track) attachTrack(pub.track, participant);
      }
    }

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      setStatus("Opening the room…");
      try {
        const res = await fetch("/token");
        if (!res.ok) throw new Error(await res.text());
        const { token, url, roomName } = await res.json();
        setStatus(`Joining ${roomName}…`);

        room = new Room({ adaptiveStream: false, dynacast: true });
        room.on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
          attachTrack(track, participant);
        });
        room.on(RoomEvent.ParticipantConnected, (participant) => {
          setStatus(`Joined: ${participant.identity}`);
          maybeAttachParticipant(participant);
        });

        await room.connect(url, token);
        await room.localParticipant.setMicrophoneEnabled(true);
        setStatus("Connected — waiting for face + voice…");

        for (const p of room.remoteParticipants.values()) {
          maybeAttachParticipant(p);
        }
      } catch (err) {
        console.error(err);
        setStatus(`Error: ${err.message || err}`);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
